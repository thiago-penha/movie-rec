# Alembic config. The database URL is not here: migrations/env.py reads DATABASE_URL
# through common.config, like the services do.
[alembic]
script_location = %(here)s/migrations
# Files named like 0002_add_reviews.py. Pass --rev-id 0002 to `alembic revision`
# (`make migration` does), otherwise the prefix is a random hex id.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
