[project]
name = "cinematch-ingestion"
version = "0.1.0"
description = "CineMatch ingestion worker: TMDB fetching, embeddings, Letterboxd matching."
requires-python = ">=3.12"
dependencies = [
    "cinematch-common",
    "httpx>=0.29",
    "tenacity>=9.2",
]

[tool.uv.sources]
cinematch-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingestion"
