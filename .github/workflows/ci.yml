name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per package, so a failure points straight at the service that broke.
      matrix:
        package: [libs/common, services/api, services/ingestion, services/recommender]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        # --frozen: fail if uv.lock is out of date instead of silently updating it.
        run: uv sync --all-packages --frozen
      - name: Lint
        run: |
          uv run ruff check ${{ matrix.package }}
          uv run ruff format --check ${{ matrix.package }}
      - name: Test
        run: uv run pytest ${{ matrix.package }}/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
