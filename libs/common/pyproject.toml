[project]
name = "cinematch-common"
version = "0.1.0"
description = "Shared code for CineMatch services: config, database, models, embeddings."
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
]

# Phase 3 adds an optional extra here:
#   [project.optional-dependencies]
#   embeddings = ["sentence-transformers", "torch"]   (torch from the CPU-only index)
# Only ingestion and recommender install it, so the api image stays small.

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common"
